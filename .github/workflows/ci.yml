name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2
      - name: Check files and check-runner tests
        env:
          SKIP: full-project-check
        run: pre-commit run --all-files --show-diff-on-failure
  checks:
    name: ${{ matrix.group }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [build-api, build-web, health, migrations, test, lint, format, typecheck, security, outdated, metrics]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run check group
        env:
          CHECK_GROUP: ${{ matrix.group }}
        run: bash scripts/check.sh "$CHECK_GROUP"
      - name: Save full check logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs-${{ matrix.group }}
          path: /tmp/turbo-check.*/
          if-no-files-found: ignore
  ci-success:
    needs: [setup, checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          SETUP_RESULT: ${{ needs.setup.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          if [[ "$SETUP_RESULT" == success && "$CHECKS_RESULT" == success ]]; then
            echo "All CI checks passed."
          else
            echo "CI failed: setup=$SETUP_RESULT, checks=$CHECKS_RESULT"
            exit 1
          fi
