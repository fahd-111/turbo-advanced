[project]
name = "api"
requires-python = ">=3.13"
version = "0.1.0"
dependencies = [
    "django>=5.1",
    "psycopg[binary]>=3.2",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.28",
    "django-unfold>=0.43.0",
    "requests>=2.32.5",
    "cloudinary>=1.44.1",
    "pillow>=11.0.0",
    "sentry-sdk[django]>=2.0.0",
    "celery[redis]>=5.6.3,<6",
    "gunicorn>=21.2",
    "uvicorn>=0.30",
    "whitenoise>=6.8",
]

[dependency-groups]
dev = [
    "pip-audit>=2.9,<3",
    "pytest>=8.3.4",
    "pytest-django>=4.9.0",
    "pytest-factoryboy>=2.7.0",
    "ruff>=0.16.7",
]

[tool.ruff]
fix = true
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.pytest.ini_options]
filterwarnings = "ignore"
addopts = "--strict-config --strict-markers --ds=api.settings"
