# =============================================================================
# Production Docker Compose - Optimized for Coolify
# =============================================================================
# Coolify handles: SSL/TLS, Reverse Proxy, Domain routing
# This compose handles: App services, Database, Redis, Celery
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # DATABASE
  # ---------------------------------------------------------------------------
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    expose:
      - "5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-internal

  # ---------------------------------------------------------------------------
  # REDIS
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8-bookworm
    restart: unless-stopped
    expose:
      - "6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-internal

  # ---------------------------------------------------------------------------
  # BACKEND API (Django/Gunicorn)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: backend
      dockerfile: Dockerfile.prod
    image: api:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - .env
    environment:
      - DEBUG=0
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_HOST=db
      - DATABASE_NAME=${POSTGRES_DB:-app}
      - DATABASE_USER=${POSTGRES_USER:-postgres}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
      - SENTRY_DSN=${SENTRY_DSN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      glitchtip-web:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4000/health/" ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          memory: 1024M
    networks:
      - app-internal
      - app-external

  # ---------------------------------------------------------------------------
  # FRONTEND (Next.js)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: frontend
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
        - NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:?Set a persistent Server Actions key in .env}
    image: web:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:?Set a persistent Server Actions key in .env}
      - API_URL=http://api:4000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          memory: 1024M
    networks:
      - app-internal
      - app-external

  # ---------------------------------------------------------------------------
  # CELERY WORKER (Background Tasks)
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: backend
      dockerfile: Dockerfile.prod
    image: api:${VERSION:-latest}
    command: [ "celery", "-A", "api.celery", "worker", "--loglevel=info", "--concurrency=4" ]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DEBUG=0
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_HOST=db
      - DATABASE_NAME=${POSTGRES_DB:-app}
      - DATABASE_USER=${POSTGRES_USER:-postgres}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A api.celery inspect ping --destination celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 1024M
    networks:
      - app-internal

  # ---------------------------------------------------------------------------
  # CELERY BEAT (Scheduled Tasks)
  # ---------------------------------------------------------------------------
  celery-beat:
    build:
      context: backend
      dockerfile: Dockerfile.prod
    image: api:${VERSION:-latest}
    command: [ "celery", "-A", "api.celery", "beat", "--loglevel=info" ]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DEBUG=0
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_HOST=db
      - DATABASE_NAME=${POSTGRES_DB:-app}
      - DATABASE_USER=${POSTGRES_USER:-postgres}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import time; assert time.time() - Path('/tmp/celery-beat-health').stat().st_mtime < 30"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1024M
        reservations:
          memory: 1024M
    networks:
      - app-internal

  # ---------------------------------------------------------------------------
  # GLITCHTIP (Error Tracking, Performance & Uptime Monitoring)
  # ---------------------------------------------------------------------------
  glitchtip-db:
    image: postgres:17-bookworm
    restart: unless-stopped
    expose:
      - "5432"
    volumes:
      - glitchtip_db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U glitchtip" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-internal

  glitchtip-web:
    image: glitchtip/glitchtip:6.2.6
    command: ["sh", "-c", "./bin/run-migrate.sh && exec ./bin/start.sh"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD}@glitchtip-db:5432/glitchtip
      VALKEY_URL: redis://redis:6379/1
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      PORT: 8000
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-noreply@localhost}
      ENABLE_OPEN_USER_REGISTRATION: ${GLITCHTIP_OPEN_REGISTRATION:-false}
    depends_on:
      glitchtip-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - app-internal
      - app-external

  glitchtip-worker:
    image: glitchtip/glitchtip:6.2.6
    restart: unless-stopped
    command: ["python", "manage.py", "runworker", "--scheduler", "--health-check-file", "/tmp/worker-health"]
    environment:
      IS_WORKER: "true"
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD}@glitchtip-db:5432/glitchtip
      VALKEY_URL: redis://redis:6379/1
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-noreply@localhost}
    depends_on:
      glitchtip-web:
        condition: service_healthy
      glitchtip-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import time; assert time.time() - Path('/tmp/worker-health').stat().st_mtime < 60"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - app-internal

# -----------------------------------------------------------------------------
# VOLUMES
# -----------------------------------------------------------------------------
volumes:
  postgresql_data:
    driver: local
  redis_data:
    driver: local
  glitchtip_db:
    driver: local

# -----------------------------------------------------------------------------
# NETWORKS
# -----------------------------------------------------------------------------
networks:
  app-internal:
    driver: bridge
    internal: true
  app-external:
    driver: bridge
